<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Old Tractor Parts</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <header>
    <h1>Old Tractor Parts</h1>
    <button class="btn-logout" id="logout-btn" title="Log out">Log out</button>
  </header>

  <nav id="tabs">
    <button class="tab active" data-view="list">📋 Inventory</button>
    <button class="tab" data-view="camera">📷 New Part</button>
  </nav>

  <!-- LIST VIEW -->
  <section id="view-list" class="view active">
    <div class="list-tools">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search" class="field-input" type="search" inputmode="search"
               enterkeyhint="search" placeholder="Search brand, number, type, location…"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
               aria-label="Search inventory">
        <button id="search-clear" class="btn-icon" type="button" aria-label="Clear search" hidden>✕</button>
      </div>
      <div class="filter-chips" id="filter-chips" role="tablist" aria-label="Filter by status">
        <button class="chip active" data-filter="active" type="button">Active <span class="chip-count"></span></button>
        <button class="chip" data-filter="pending" type="button"><span class="dot dot-pending"></span>Pending <span class="chip-count"></span></button>
        <button class="chip" data-filter="approved" type="button"><span class="dot dot-approved"></span>Approved <span class="chip-count"></span></button>
        <button class="chip" data-filter="posted" type="button"><span class="dot dot-posted"></span>Posted <span class="chip-count"></span></button>
        <button class="chip" data-filter="sold" type="button"><span class="dot dot-sold"></span>Sold <span class="chip-count"></span></button>
        <button class="chip" data-filter="all" type="button">All <span class="chip-count"></span></button>
      </div>
    </div>
    <div id="parts-list"></div>
    <div id="empty-state" class="empty" hidden>
      <p>No parts yet</p>
      <button class="btn btn-primary" onclick="switchView('camera')">📷 Add first part</button>
    </div>
  </section>

  <!-- CAMERA VIEW -->
  <section id="view-camera" class="view">
    <div class="camera-container">
      <p class="hint">Take 1 to 4 photos of the box/label. Include all visible numbers. Use Google Lens to identify, then add the screenshot.</p>
      <div id="photo-previews"></div>
      <p id="photo-count" class="photo-count" hidden></p>

      <div class="camera-actions" id="camera-actions">
        <label class="btn btn-primary btn-lg" id="capture-btn">
          📷 Take Photo
          <input type="file" accept="image/*" capture="environment" id="photo-input" hidden>
        </label>
        <label class="btn btn-outline" id="gallery-btn">
          🖼 Choose from Gallery
          <input type="file" accept="image/*" multiple id="gallery-input" hidden>
        </label>
        <button class="btn btn-outline" id="lens-btn" onclick="window.open('https://www.google.com/','_blank')">🔍 Google Lens</button>
        <button class="btn btn-success btn-lg" id="submit-btn" disabled>🤖 Identify Part</button>
      </div>

      <div id="upload-status" class="upload-status" role="status" aria-live="polite" hidden>
        <div class="spinner spinner-lg"></div>
        <p class="status-title" id="status-title">📤 Uploading photos…</p>
        <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <p class="status-sub" id="status-sub"></p>
      </div>

      <div id="upload-error" class="upload-error" hidden>
        <div class="alert alert-error" id="upload-error-msg" role="alert"></div>
        <button class="btn btn-primary btn-lg" id="retry-upload-btn">🔄 Retry</button>
        <button class="btn btn-outline" id="cancel-upload-btn">Cancel</button>
      </div>
    </div>
  </section>

  <!-- DETAIL VIEW -->
  <section id="view-detail" class="view">
    <div id="detail-content"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js?v=3"></script>
</body>
</html>
