<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Entrar — Old Tractor Parts</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <img src="/icon-192.png" alt="" class="login-logo" width="88" height="88">
    <h1>Old Tractor Parts</h1>
    <p class="login-sub">Entra para ver tu inventario</p>

    <form id="login-form" method="post" action="/api/login" autocomplete="on" novalidate>
      <label class="field-label" for="user">Usuario</label>
      <input class="field-input" id="user" name="username" type="text"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" enterkeyhint="next" required>

      <label class="field-label" for="password">Contraseña</label>
      <div class="password-wrap">
        <input class="field-input" id="password" name="password" type="password"
               autocomplete="current-password" enterkeyhint="go" required>
        <button type="button" class="btn-icon" id="toggle-pass" aria-label="Mostrar contraseña">👁</button>
      </div>

      <div id="login-error" class="alert alert-error" role="alert" hidden></div>

      <button type="submit" class="btn btn-primary btn-lg" id="login-btn">Entrar</button>
    </form>
  </main>

  <script src="/login.js"></script>
</body>
</html>
